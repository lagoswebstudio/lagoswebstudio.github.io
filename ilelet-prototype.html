<!DOCTYPE html>

<style>

*{box-sizing:border-box;margin:0;padding:0}
html,html body{background:#FAF7F2!important;color:#17181C!important}
html{-webkit-text-size-adjust:100%;color-scheme:only light}
body{font:400 15px/1.5 Onest,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
#app{background:#FAF7F2;color:#17181C;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

.brand{font:700 20px Unbounded,Onest,sans-serif;letter-spacing:-.02em}

.hide{display:none!important}

/* SHELL */
.top{position:sticky;top:0;z-index:30;background:#FAF7F2;border-bottom:1px solid #E8E3DA;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
.plan-pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:#FFE9E0;color:#B23A12;border:0}
.side{display:none}
.main{padding:16px 16px 110px;max-width:980px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#FFFFFF;border-top:1px solid #E8E3DA;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:#9096A3;border-radius:12px;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:#F45D2C;background:#FFE9E0}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:#C8322B;color:#FFFFFF;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
@media(min-width:960px){
  #shell{display:flex;min-height:100vh}
  .side{display:flex;flex-direction:column;width:240px;flex:none;background:#FFFFFF;border-right:1px solid #E8E3DA;padding:22px 14px;position:sticky;top:0;height:100vh}
  .side nav{display:grid;gap:4px;margin-top:28px}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:11px 12px;border-radius:12px;font-weight:600;color:#5B5F6B;text-align:left;position:relative}
  .side nav button svg{width:20px;height:20px}
  .side nav button.on{background:#FFE9E0;color:#B23A12}
  .side nav .badge{position:static;margin-left:auto}
  .side .plan-pill{margin-top:auto;align-self:flex-start}
  .content{flex:1;min-width:0}
  .top,.tabs{display:none}
  .main{padding:30px 32px 60px}
}

/* COMMON */
.h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.h h1{font:700 24px/1.15 Unbounded,Onest,sans-serif;letter-spacing:-.02em}
.h p{color:#5B5F6B;font-size:14px;margin-top:4px}
.card{background:#FFFFFF;border:1px solid #E8E3DA;border-radius:18px;padding:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.kpi{background:#FFFFFF;border:1px solid #E8E3DA;border-radius:16px;padding:14px}
.kpi p{font-size:12.5px;color:#9096A3;font-weight:600}
.kpi b{display:block;font:700 22px Unbounded,Onest,sans-serif;letter-spacing:-.02em;margin-top:4px}
.kpi small{font-size:12px;color:#5B5F6B}
.kpi.dark{background:#17181C;border-color:#17181C;color:#FFFFFF}
.kpi.dark p,.kpi.dark small{color:#B9BCC5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #E8E3DA;background:#FFFFFF;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;transition:transform .15s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:#F45D2C;border-color:#F45D2C;color:#FFFFFF}
.btn.dark{background:#17181C;border-color:#17181C;color:#FFFFFF}
.btn.wa{background:#12855B;border-color:#12855B;color:#FFFFFF}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:17px;height:17px;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F2EEE7;color:#5B5F6B;white-space:nowrap}
.tag.g{background:#E2F5EC;color:#0B6B48}.tag.a{background:#FFF2DB;color:#8A5300}.tag.r{background:#FDE7E5;color:#A3241E}.tag.b{background:#E6ECFC;color:#2346AE}.tag.f{background:#FFE9E0;color:#B23A12}.tag.v{background:#EFE8FB;color:#5B36A6}
.muted{color:#9096A3;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F1ECE3}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:14.5px}
.row small{color:#9096A3;font-size:12.5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:19px;height:19px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #E8E3DA;background:#FFFFFF;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#5B5F6B}
.chip.on{background:#17181C;border-color:#17181C;color:#FFFFFF}
.empty{text-align:center;color:#9096A3;padding:22px 10px;font-size:14px}
.greet{background:#17181C;color:#FFFFFF;border-radius:20px;padding:18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}

.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;font-size:13.5px;margin-bottom:8px}
.alert.r{background:#FDE7E5;color:#8E1E19}.alert.a{background:#FFF2DB;color:#7A4A00}.alert.b{background:#E6ECFC;color:#1F3E9A}
.alert button{margin-left:auto;flex:none}

/* CALENDAR */
.cal{background:#FFFFFF;border:1px solid #E8E3DA;border-radius:18px;overflow:hidden}
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal-grid{position:relative;min-width:max-content}
.cal-head,.cal-row{display:flex}
.cal-name{position:sticky;left:0;z-index:3;width:118px;flex:none;background:#FFFFFF;border-right:1px solid #E8E3DA;padding:10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.2}
.cal-head .cal-name{background:#FAF7F2;color:#9096A3}
.cal-day{width:46px;flex:none;text-align:center;font-size:11px;color:#9096A3;padding:6px 0;border-right:1px solid #F4F0E8;line-height:1.2;background:#FAF7F2}
.cal-day b{display:block;font-size:14px;color:#17181C}
.cal-day.today{background:#FFE9E0}
.cal-day.today b{color:#B23A12}
.cal-row{position:relative;height:58px;border-top:1px solid #F1ECE3}
.cal-cell{width:46px;flex:none;border:0;border-right:1px solid #F4F0E8;background:transparent;height:100%}
.cal-cell:hover{background:#FFF6F2}
.bk{position:absolute;top:9px;height:40px;border-radius:10px;color:#FFFFFF;font-size:11.5px;font-weight:700;padding:4px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left;border:0;line-height:1.25;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bk small{display:block;font-weight:500;opacity:.9}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:#5B5F6B}
.legend span{display:flex;align-items:center;gap:6px}

/* MONEY */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:110px 1fr 92px;gap:10px;align-items:center;font-size:13px;font-weight:600}
.bar-row i{display:block;height:10px;border-radius:9px;background:#F1ECE3;overflow:hidden}
.bar-row i span{display:block;height:100%;border-radius:9px}
.bar-row b{text-align:right}
.spark{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.spark i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:#F45D2C}
.spark i.x{background:#17181C}
.spark small{font-size:10.5px;color:#9096A3}

/* MORE */
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:760px){.more-grid{grid-template-columns:repeat(3,1fr)}}
.more-grid>*{min-width:0}
.tile .tag{white-space:normal;text-align:left}
.tile{background:#FFFFFF;border:1px solid #E8E3DA;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:118px}
.tile b{font-size:14.5px}
.tile{min-width:0}.tile .tag{white-space:normal;line-height:1.3}
.tile small{color:#9096A3;font-size:12.5px;line-height:1.35}
.plans{display:grid;gap:10px}
@media(min-width:760px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:#FFFFFF;border:1px solid #E8E3DA;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.pro{background:#17181C;color:#FFFFFF;border-color:#17181C}
.plan .price{font:700 26px Unbounded,Onest,sans-serif}
.plan ul{list-style:none;display:grid;gap:6px;font-size:13.5px}
.plan li:before{content:"✓ ";color:#F45D2C;font-weight:700}
.plan.pro li{color:#E1E3E8}

/* SHEET */
.sheet{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:80;background:rgba(23,24,28,.55);align-items:flex-end;justify-content:center}
.sheet.open{display:flex;animation:fd .2s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}
.panel{background:#FFFFFF;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:22px}}
.grab{width:40px;height:5px;border-radius:9px;background:#E8E3DA;margin:0 auto 12px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph h2{font:700 19px Unbounded,Onest,sans-serif;letter-spacing:-.02em;flex:1;min-width:0}
.x{width:36px;height:36px;border-radius:50%;border:1px solid #E8E3DA;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.lbl{display:block;font-size:12.5px;font-weight:700;color:#5B5F6B;margin-bottom:5px}
.inp{width:100%;min-width:0;padding:12px;border-radius:12px;border:1px solid #E8E3DA;background:#FAF7F2;font-size:16px;-webkit-appearance:none;appearance:none;min-height:46px}
.inp:focus{outline:none;border-color:#F45D2C;background:#FFFFFF}
.form{display:grid;gap:12px}
.form .grid2>*{min-width:0}
.err{color:#A3241E;font-size:13.5px;font-weight:600;min-height:18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:#FAF7F2;border-radius:12px;padding:10px 12px;font-size:12px;color:#9096A3;font-weight:600}
.kv b{display:block;color:#17181C;font-size:15px;margin-top:2px}
.kv .w{grid-column:span 2}

.guest{background:#FAF7F2;border-radius:18px;overflow:hidden;border:1px solid #E8E3DA}

.guest .body{padding:16px 18px;display:grid;gap:12px;font-size:14px}
.guest .pw{background:#FFFFFF;border:1px dashed #E8E3DA;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17181C;color:#FFFFFF;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:99;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@media(min-width:960px){.toast{bottom:28px}}
.demo-note{font-size:12px;color:#9096A3;text-align:center;margin-top:18px}
</style>

    var b={id:"b"+Date.now(),apt:$("fApt").value,guest:nm,phone:$("fPhone").value.trim(),in:$("fIn").value,out:$("fOut").value,ch:$("fCh").value,total:+String($("fTot").value).replace(/[^0-9]/g,"")||0,paid:+String($("fPaid").value).replace(/[^0-9]/g,"")||0,caution:+String($("fCau").value).replace(/[^0-9]/g,"")||0,ded:[],refunded:false,idOk:false,note:""};
    D.bookings.push(b);save();closeSheet();toast("Booking saved");openBooking(b.id);});}

function openBooking(id){var b=null;D.bookings.forEach(function(x){if(x.id===id)b=x;});if(!b)return;var a=apt(b.apt),st=status(b);
  var link="ilelet.com/stay/"+b.id;
  var ciMsg="Hi "+b.guest.split(" ")[0]+", welcome! Your check-in details for "+a.name+" ("+fmt(b.in)+" → "+fmt(b.out)+") are here: "+link+"\nPlease upload your ID on the page before arrival. See you soon!";
  var rcMsg="RECEIPT · "+D.biz.name+"\nGuest: "+b.guest+"\nApartment: "+a.name+"\nStay: "+fmt(b.in)+" → "+fmt(b.out)+" ("+nights(b.in,b.out)+" nights)\nTotal: "+N(b.total)+"\nPaid: "+N(b.paid)+"\nBalance: "+N(bal(b))+"\nCaution fee: "+N(b.caution)+" (refundable)\nThank you for staying with us!";
  var balMsg="Hi "+b.guest.split(" ")[0]+", a gentle reminder that "+N(bal(b))+" is outstanding for your stay at "+a.name+" ("+fmt(b.in)+"). Thank you!";
  var refund=b.caution-dedTotal(b);
  var rfMsg="Hi "+b.guest.split(" ")[0]+", thanks for staying at "+a.name+"! Your caution fee refund is "+N(refund)+(b.ded.length?" (deductions: "+b.ded.map(function(d){return d.l+" "+N(d.a);}).join(", ")+")":"")+". It's on its way.";
  openSheet(head(esc(b.guest))+
  '<div class="tags" style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag" style="background:'+CH[b.ch]+';color:#fff">'+b.ch+'</span><span class="tag '+(st==="in"?"g":st==="up"?"b":"")+'">'+(st==="in"?"In-house":st==="up"?"Upcoming":"Checked out")+'</span>'+(b.idOk?'<span class="tag g">ID verified</span>':'<span class="tag r">ID missing</span>')+'</div>'+
  '<div class="kv"><div class="w">Apartment<b>'+esc(a.name)+'</b></div><div>Check-in<b>'+fmt(b.in,{weekday:"short",day:"numeric",month:"short"})+'</b></div><div>Check-out<b>'+fmt(b.out,{weekday:"short",day:"numeric",month:"short"})+'</b></div><div>Total ('+nights(b.in,b.out)+' nights)<b>'+N(b.total)+'</b></div><div>Balance<b style="color:'+(bal(b)?"#A3241E":"#0B6B48")+'">'+N(bal(b))+'</b></div></div>'+
  '<div class="sec">PAYMENTS</div><div style="display:flex;gap:8px"><input class="inp" id="payAmt" inputmode="numeric" placeholder="Amount received (₦)"><button class="btn dark" type="button" id="payAdd">Record</button></div>'+
  '<div class="sec">CAUTION FEE · '+N(b.caution)+(b.refunded?' · <span style="color:#0B6B48">REFUNDED</span>':'')+'</div>'+
  (b.ded.length?b.ded.map(function(d){return '<div class="row"><div class="grow"><b>'+esc(d.l)+'</b></div><b>−'+N(d.a)+'</b></div>';}).join(""):'<p class="muted">No deductions.</p>')+
  (!b.refunded?'<div class="grid2" style="margin-top:8px"><input class="inp" id="dedL" placeholder="Deduction (e.g. broken glass)"><input class="inp" id="dedA" inputmode="numeric" placeholder="₦ amount"></div><div class="acts" style="margin-top:8px"><button class="btn" type="button" id="dedAdd">Add deduction</button><button class="btn" type="button" id="refDone">Mark refunded '+N(refund)+'</button></div>':'')+
  '<div class="sec">SEND ON WHATSAPP</div><div class="acts">'+
  '<a class="btn wa" target="_blank" rel="noopener" href="'+wa(b.phone,ciMsg)+'">'+ICON.wa+'Check-in link</a>'+
  '<a class="btn" target="_blank" rel="noopener" href="'+wa(b.phone,rcMsg)+'">Receipt</a>'+
  (bal(b)?'<a class="btn" target="_blank" rel="noopener" href="'+wa(b.phone,balMsg)+'">Balance reminder</a>':'')+
  (st==="past"&&!b.refunded?'<a class="btn" target="_blank" rel="noopener" href="'+wa(b.phone,rfMsg)+'">Refund message</a>':'')+
  '<button class="btn" type="button" id="idTog">'+(b.idOk?"Mark ID missing":"Mark ID received")+'</button>'+
  '<button class="btn" type="button" data-tool="guestpage" data-b="'+b.id+'">Preview guest page</button></div>'+
  '<div class="sec">PRIVATE NOTES</div><textarea class="inp" id="noteIn" rows="3" placeholder="Preferences, late arrival, special requests...">'+esc(b.note)+'</textarea>'+
  '<button class="btn block" type="button" id="delB" style="margin-top:12px;color:#A3241E">Cancel booking</button>');
  $("payAdd").addEventListener("click",function(){var v=+String($("payAmt").value).replace(/[^0-9]/g,"");if(!v)return;b.paid=Math.min(b.total,b.paid+v);save();toast("Payment recorded");openBooking(id);});
  if($("dedAdd"))$("dedAdd").addEventListener("click",function(){var l=$("dedL").value.trim(),v=+String($("dedA").value).replace(/[^0-9]/g,"");if(!l||!v)return;b.ded.push({l:l,a:v});save();openBooking(id);});
  if($("refDone"))$("refDone").addEventListener("click",function(){b.refunded=true;save();toast("Caution fee refunded");openBooking(id);});
  $("idTog").addEventListener("click",function(){b.idOk=!b.idOk;save();openBooking(id);});
  $("noteIn").addEventListener("input",function(){b.note=this.value;save();});
  $("delB").addEventListener("click",function(){if(confirm("Cancel "+b.guest+"'s booking?")){D.bookings=D.bookings.filter(function(x){return x.id!==id;});save();closeSheet();toast("Booking cancelled");}});}

function expenseForm(){openSheet(head("Add expense")+'<div class="form"><div class="grid2"><label><span class="lbl">Category</span><select class="inp" id="eCat"><option>Diesel</option><option>Cleaning</option><option>DSTV &amp; internet</option><option>Electricity (prepaid)</option><option>Repairs</option><option>Toiletries &amp; supplies</option><option>Staff</option><option>Other</option></select></label><label><span class="lbl">Amount (₦)</span><input class="inp" id="eAmt" inputmode="numeric"></label></div><div class="grid2"><label><span class="lbl">Apartment</span><select class="inp" id="eApt"><option value="all">All apartments</option>'+D.apts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></label><label><span class="lbl">Date</span><input class="inp" type="date" id="eDate" value="'+TODAY+'"></label></div><p class="err" id="eErr"></p><button class="btn pri block" type="button" id="eSave">Save expense</button></div>');
  $("eSave").addEventListener("click",function(){var v=+String($("eAmt").value).replace(/[^0-9]/g,"");if(!v){$("eErr").textContent="Enter an amount.";return;}D.expenses.push({id:"e"+Date.now(),cat:$("eCat").value,amt:v,apt:$("eApt").value,date:$("eDate").value||TODAY});save();closeSheet();toast("Expense added");});}

function tool(t,bId){
  if(t==="reset"){if(confirm("Reset all demo data?")){D=seed();save();toast("Demo reset");render();nav();}return;}
  if(t==="plans"){go("plans");return;}
  if(t==="apts"){openSheet(head("Apartments")+D.apts.map(function(a){return '<div class="row"><span class="dot" style="background:'+a.color+'"></span><div class="grow"><b>'+esc(a.name)+'</b><small>'+esc(a.area)+' · '+N(a.rate)+' weekday · '+N(a.wkd)+' Fri/Sat</small></div><button class="btn sm" type="button" data-editapt="'+a.id+'">Edit</button></div>';}).join("")+'<p class="muted" style="margin-top:10px">Free plan includes 1 apartment. Pro covers up to 5.</p>');return;}
  if(t==="cleaners"){openSheet(head("Cleaners")+D.cleaners.map(function(c){return '<div class="row"><div class="grow"><b>'+esc(c.name)+'</b><small>'+esc(c.phone)+'</small></div><a class="btn sm wa" target="_blank" rel="noopener" href="'+wa(c.phone,"Hi "+c.name+", are you available to clean an apartment today?")+'">Message</a></div>';}).join("")+'<div class="sec">CLEANING AFTER CHECK-OUT</div>'+cleaningTasks().map(function(c){return '<div class="row"><div class="grow"><b>'+esc(apt(c.b.apt).name)+'</b><small>after '+esc(c.b.guest)+' · '+fmt(c.b.out)+'</small></div>'+(c.done?'<span class="tag g">Clean</span>':'<button class="btn sm" type="button" data-clean="'+c.id+'">Mark clean</button>')+'</div>';}).join(""));return;}
  if(t==="maint"){openSheet(head("Maintenance")+D.maint.map(function(m){var od=P(m.due)<T;return '<div class="row"><div class="grow"><b>'+esc(m.item)+'</b><small>'+esc(apt(m.apt).name)+' · due '+fmt(m.due)+'</small></div><span class="tag '+(od?"r":"a")+'">'+(od?"Overdue":"Soon")+'</span><button class="btn sm" type="button" data-maint="'+m.id+'">Done</button></div>';}).join("")+'<p class="muted" style="margin-top:10px">Marking done schedules the next one automatically (generator every 30 days, AC every 90, fumigation every 60).</p>');return;}
  if(t==="guestpage"){var b=null;D.bookings.forEach(function(x){if(x.id===bId)b=x;});b=b||D.bookings[1];var a=apt(b.apt);
    openSheet(head("Guest check-in page")+'<p class="muted" style="margin-bottom:10px">What '+esc(b.guest)+' sees at ilelet.com/stay/'+b.id+'</p><div class="guest"><div class="hero"><span class="tag f">Your stay</span><h3>Welcome, '+esc(b.guest.split(" ")[0])+'</h3><p style="color:#B9BCC5;font-size:14px">'+esc(a.name)+' · '+fmt(b.in)+' → '+fmt(b.out)+'</p></div><div class="body"><div><span class="lbl">Address</span>'+esc(a.area)+'</div><div class="grid2"><div><span class="lbl">Check-in</span>From 2:00pm</div><div><span class="lbl">Check-out</span>By 12:00pm</div></div><div class="pw"><span><span class="lbl">Wi-Fi</span>'+esc(a.wifi)+'</span><span><span class="lbl">Password</span>'+esc(a.pass)+'</span></div><div><span class="lbl">House rules</span>No parties · No smoking indoors · Quiet hours 10pm–7am · Caution fee '+N(b.caution)+' refunded within 48 hours of check-out</div><button class="btn dark block" type="button" onclick="this.textContent=\'ID uploaded ✓\'">Upload your ID</button><a class="btn wa block" target="_blank" rel="noopener" href="'+wa(D.biz.phone,"Hi, I'm "+b.guest+" staying at "+a.name+".")+'">'+ICON.wa+'Message your host</a><p class="muted" style="text-align:center">Powered by <b>ilelet</b></p></div></div>');return;}
  if(t==="quote"){openSheet(head("Price calculator")+'<div class="form"><label><span class="lbl">Apartment</span><select class="inp" id="qApt">'+D.apts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></label><div class="grid2"><label><span class="lbl">Check-in</span><input class="inp" type="date" id="qIn" value="'+iso(add(T,1))+'"></label><label><span class="lbl">Check-out</span><input class="inp" type="date" id="qOut" value="'+iso(add(T,4))+'"></label></div><div class="grid2"><label><span class="lbl">Discount %</span><input class="inp" id="qDis" inputmode="numeric" value="0"></label><label><span class="lbl">Caution fee (₦)</span><input class="inp" id="qCau" inputmode="numeric" value="50000"></label></div><div class="kv" id="qOut2"></div><label><span class="lbl">Guest WhatsApp (optional)</span><input class="inp" id="qPh" inputmode="tel" placeholder="080..."></label><a class="btn wa block" id="qSend" target="_blank" rel="noopener">'+ICON.wa+'Send quote</a></div>');
    function q(){var a=apt($("qApt").value),n=nights($("qIn").value,$("qOut").value),sub=0,wk=0;if(n<=0){$("qOut2").innerHTML='<div class="w">Check-out must be after check-in</div>';return;}
      for(var k=0;k<n;k++){var d=add(P($("qIn").value),k).getDay();if(d===5||d===6){sub+=a.wkd;wk++;}else sub+=a.rate;}
      var dis=Math.round(sub*(Math.min(90,+$("qDis").value||0))/100),cau=+String($("qCau").value).replace(/[^0-9]/g,"")||0,tot=sub-dis;
      $("qOut2").innerHTML='<div>Nights<b>'+n+' ('+wk+' weekend)</b></div><div>Subtotal<b>'+N(sub)+'</b></div><div>Discount<b>−'+N(dis)+'</b></div><div>Caution (refundable)<b>'+N(cau)+'</b></div><div class="w">Total to pay<b style="font-size:20px">'+N(tot+cau)+'</b></div>';
      $("qSend").href=wa($("qPh").value||D.biz.phone,"Quote for "+a.name+"\n"+fmt($("qIn").value)+" → "+fmt($("qOut").value)+" ("+n+" nights)\nStay: "+N(tot)+(dis?" (after "+N(dis)+" discount)":"")+"\nCaution fee: "+N(cau)+" (refundable)\nTotal: "+N(tot+cau));}
    ["qApt","qIn","qOut","qDis","qCau","qPh"].forEach(function(id){$(id).addEventListener("input",q);$(id).addEventListener("change",q);});q();return;}
  if(t==="directlink"){openSheet(head("Direct booking link")+'<p class="muted">Share one link on Instagram, WhatsApp status and Google. Guests see your apartments, pick dates that are actually free, and send you a booking request. No platform commission.</p><div class="guest" style="margin-top:12px"><div class="body"><div class="pw"><span>ilelet.com/<b>'+esc(D.biz.name.toLowerCase().replace(/[^a-z0-9]+/g,"-"))+'</b></span><button class="btn sm" type="button" onclick="this.textContent=\'Copied\'">Copy</button></div></div></div><p class="muted" style="margin-top:10px">Included in Business. Pro users get the link with Ilelet branding.</p>');return;}
  if(t==="rules"){var rules="HOUSE RULES · "+D.biz.name+"\n1. Check-in from 2pm, check-out by 12 noon.\n2. No parties or events without written approval.\n3. No smoking indoors.\n4. Maximum guests as booked. Extra guests must be approved.\n5. Quiet hours 10pm to 7am.\n6. Please switch off the AC and lights when going out.\n\nCAUTION FEE\nA refundable caution fee is paid before check-in. It is returned within 48 hours of check-out, minus the cost of any damage, missing items or extra cleaning, with photos shared.";
    openSheet(head("House rules generator")+'<textarea class="inp" id="rTxt" rows="14" style="font-size:14px">'+esc(rules)+'</textarea><div class="acts" style="margin-top:10px"><a class="btn wa" id="rSend" target="_blank" rel="noopener">'+ICON.wa+'Send to guest</a><button class="btn" type="button" id="rCopy">Copy</button></div>');
    function r(){$("rSend").href=wa(D.biz.phone,$("rTxt").value);}$("rTxt").addEventListener("input",r);r();
    $("rCopy").addEventListener("click",function(){var ta=$("rTxt");ta.select();try{document.execCommand("copy");toast("Copied");}catch(e){}});return;}
  if(t==="ical"){var a=apt(bId);openSheet(head("Connect Airbnb calendar")+'<ol style="padding-left:18px;display:grid;gap:8px;font-size:14px"><li>In Airbnb, open <b>Calendar → Availability → Connect calendars</b>.</li><li>Copy the <b>Export calendar</b> link.</li><li>Paste it below.</li></ol><div class="form" style="margin-top:12px"><input class="inp" id="icalIn" placeholder="https://www.airbnb.com/calendar/ical/..."><button class="btn pri block" type="button" id="icalSave">Connect '+esc(a.name)+'</button></div>');
    $("icalSave").addEventListener("click",function(){a.ical=true;save();closeSheet();toast("Calendar connected");});return;}
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tool]");if(t){tool(t.getAttribute("data-tool"),t.getAttribute("data-b"));return;}
  var ic=e.target.closest("[data-ical]");if(ic){tool("ical",ic.getAttribute("data-ical"));return;}
  var o=e.target.closest("[data-open]");if(o){openBooking(o.getAttribute("data-open"));return;}
  var c=e.target.closest("[data-cell]");if(c){var p=c.getAttribute("data-cell").split("|");if(P(p[1])<T){toast("That day has passed");return;}bookingForm({apt:p[0],in:p[1],out:iso(add(P(p[1]),2))});return;}
  if(e.target.closest("[data-new]")){bookingForm();return;}
  if(e.target.closest("[data-expense]")){expenseForm();return;}
  var cl=e.target.closest("[data-clean]");if(cl){D.cleanDone[cl.getAttribute("data-clean")]=true;save();toast("Marked clean");if($("sheet").classList.contains("open"))tool("cleaners");else{render();nav();}return;}
  var m=e.target.closest("[data-maint]");if(m){var id=m.getAttribute("data-maint");D.maint.forEach(function(x){if(x.id===id){var days=/Generator/.test(x.item)?30:/AC/.test(x.item)?90:60;x.due=iso(add(T,days));}});save();toast("Done. Next one scheduled");if($("sheet").classList.contains("open"))tool("maint");else{render();nav();}return;}
  var ea=e.target.closest("[data-editapt]");if(ea){var a=apt(ea.getAttribute("data-editapt"));openSheet(head("Edit "+esc(a.name))+'<div class="form"><label><span class="lbl">Name</span><input class="inp" id="aN" value="'+esc(a.name)+'"></label><div class="grid2"><label><span class="lbl">Weekday rate (₦)</span><input class="inp" id="aR" inputmode="numeric" value="'+a.rate+'"></label><label><span class="lbl">Fri/Sat rate (₦)</span><input class="inp" id="aW" inputmode="numeric" value="'+a.wkd+'"></label></div><div class="grid2"><label><span class="lbl">Wi-Fi name</span><input class="inp" id="aF" value="'+esc(a.wifi)+'"></label><label><span class="lbl">Wi-Fi password</span><input class="inp" id="aP" value="'+esc(a.pass)+'"></label></div><button class="btn pri block" type="button" id="aSave">Save</button></div>');
    $("aSave").addEventListener("click",function(){a.name=$("aN").value||a.name;a.rate=+String($("aR").value).replace(/[^0-9]/g,"")||a.rate;a.wkd=+String($("aW").value).replace(/[^0-9]/g,"")||a.wkd;a.wifi=$("aF").value;a.pass=$("aP").value;save();toast("Apartment saved");tool("apts");});return;}
  var u=e.target.closest("[data-upgrade]");if(u){toast(u.getAttribute("data-upgrade")+" checkout opens Paystack in the live app");return;}
});

nav();render();
})();
</script>
</body>
</html>
